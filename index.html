<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A simple Flappy Bird clone built with vanilla HTML5 Canvas." />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <h1 class="visually-hidden">Flappy Bird</h1>
    <canvas
      id="game"
      width="400"
      height="600"
      role="img"
      aria-label="PaoPao Gaming Inc. Flappy Bird game. Press Space, click, or tap to flap."
    ></canvas>
    <p class="hint">Space / Click / Tap to flap &middot; Enter to restart</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
